# Utility Core QoL - NeoForge mod configuration
license="MIT"

[[mods]]
modId="utility_core_qol"
version="2.0.0"
displayName="Utility Core QoL"
logoFile="assets/utility_core_qol/icon.png"
credits="Biome/Dimension Titles logic ported from Traveler's Titles by YUNGNICKYOUNG (LGPLv3)\nBridging assist logic ported from BridgingMod by Will Scully (MIT)"
description='''
Utility Core QoL - Quality of life client-side improvements for Minecraft.

Features:
- Recipe Selector: when multiple crafting recipes match the same ingredients, shows a clickable grid to choose which result you want (works in Crafting Table and Player Inventory 2x2 grid)
- Biome/Dimension Titles: shows a vanilla title/subtitle when entering a new biome or dimension
- Title Vertical Offset: configurable vertical position for title/subtitle text
- Configurable settings for all features
- Bridging Assist: helps with block placement by showing where blocks can be placed based on what you're looking at
'''

[[mixins]]
config="utility_core_qol.mixins.json"

[[mixins]]
config="utility_core_qol_accessors.mixins.json"

[[mixins]]
config="utility_core_qol_bridging.mixins.json"

[[dependencies.utility_core_qol]]
    modId="neoforge"
    type="required"
    versionRange="[26.2.0.37-beta,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.utility_core_qol]]
    modId="minecraft"
    type="required"
    versionRange="[26.2]"
    ordering="NONE"
    side="BOTH"
