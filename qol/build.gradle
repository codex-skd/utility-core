plugins {
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.github.johnrengelman.shadow'
}

ext {
    mod_id = "utility_core_qol"
    mod_name = "Utility Core QoL"
}

neoForge {
    version = neo_version
}

dependencies {
}

jar {
    archiveBaseName = "utility_core_qol"
    manifest {
        attributes(
            "Mod-ID": "utility_core_qol",
            "Mod-Name": "Utility Core QoL",
            "Mod-Version": project.version.toString()
        )
    }
}